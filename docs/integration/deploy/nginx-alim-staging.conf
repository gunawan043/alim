# nginx — ALIM Core STAGING di VPS (Cycle 9.6)
#
# Pasang di: /etc/nginx/sites-available/alim-staging.conf
# Aktifkan : ln -s ../sites-available/alim-staging.conf ../sites-enabled/
# Certbot  : certbot --nginx -d alim-staging.abuhurairah.id
#
# Hanya host staging. Vhost produksi (alim.abuhurairah.id) ada di mesin lain dan
# tidak pernah memakai berkas ini.

server {
    listen 80;
    listen [::]:80;
    server_name alim-staging.abuhurairah.id;

    # Hanya untuk tantangan ACME.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alim-staging.abuhurairah.id;

    root /srv/alim-staging/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/alim-staging.abuhurairah.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alim-staging.abuhurairah.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Hanya header ini yang dipakai aplikasi. PENTING: jangan pasang
    # `proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;` di sini —
    # itu menyalin header klien dan membuka jalan memalsukan allowlist IP.
    proxy_set_header Host $host;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/alim-staging.access.log;
    error_log  /var/log/nginx/alim-staging.error.log;

    # Berkas yang tidak boleh pernah disajikan.
    location ~ /\.(?!well-known) { deny all; }
    location ~ ^/(storage|bootstrap|catabase|vendor|tests|scripts)/ { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;

        # Jalankan sebagai user web (bukan root); direktori aplikasi milik www-data.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
    }
}
